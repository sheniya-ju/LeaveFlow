<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Leave Requests | LeaveFlow</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

</head>


<body>


<div class="dashboard-layout">


    

    <aside class="sidebar">


        <div class="sidebar-logo">

            <div class="logo-icon">
                ✓
            </div>

            <span>
                LeaveFlow
            </span>

        </div>


        <nav class="sidebar-nav">


            <a
                href="dashboard.html"
                class="nav-link"
            >
                Dashboard
            </a>


            <a
                href="leave-requests.html"
                class="nav-link active"
            >
                Leave Requests
            </a>


            <a
                href="employees.html"
                class="nav-link"
            >
                Employees
            </a>


            <a
                href="calendar.html"
                class="nav-link"
            >
                Calendar
            </a>


        </nav>


        <button
            class="logout-button"
            onclick="logout()"
        >
            Logout
        </button>


    </aside>



    

    <main class="main-content">


        <!-- HEADER -->

        <header class="dashboard-header">

            <div>

                <h1>
                    Leave Requests
                </h1>

                <p>
                    Review and manage employee
                    leave requests
                </p>

            </div>

        </header>



        

        <section class="dashboard-card">


            <div class="card-header">

                <div>

                    <h2>
                        Pending Leave Requests
                    </h2>

                    <p>
                        Review employee requests
                        and approve or reject them.
                    </p>

                </div>

            </div>



            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>
                                Employee
                            </th>

                            <th>
                                Leave Type
                            </th>

                            <th>
                                Start Date
                            </th>

                            <th>
                                End Date
                            </th>

                            <th>
                                Days
                            </th>

                            <th>
                                Reason
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>



                    <tbody
                        id="requestTableBody"
                    >

                        <tr>

                            <td colspan="7">
                                Loading requests...
                            </td>

                        </tr>

                    </tbody>


                </table>


            </div>


        </section>


    </main>


</div>





<script
    src="../js/manager.js"
></script>


</body>

</html>
